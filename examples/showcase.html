<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CanvasMapper — Showcase</title>
        <style>
            body {
                margin: 0;
            }
            #map {
                width: 100vw;
                height: 100vh;
            }
            /* Live demonstration of controls theming: variables + plain overrides */
            :root {
                --cm-btn-bg: #24435c;
                --cm-btn-color: #ffd166;
                --cm-btn-radius: 999px;
            }
            .hud {
                position: fixed;
                top: 12px;
                left: 12px;
                padding: 10px 14px;
                background: rgba(15, 20, 32, 0.82);
                color: #7fd1ff;
                border-radius: 10px;
                font: 12px/1.7 monospace;
                pointer-events: none;
                max-width: 340px;
                white-space: pre-line;
            }
            .attribution {
                position: fixed;
                right: 8px;
                bottom: 8px;
                padding: 2px 6px;
                background: rgba(15, 20, 32, 0.7);
                color: #8b98a5;
                font:
                    11px system-ui,
                    sans-serif;
                border-radius: 4px;
            }
            .attribution a {
                color: #7fd1ff;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <div class="hud" id="hud"></div>
        <div class="attribution">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</div>
        <script type="module">
            import { MapEngine, UrlTileSource } from '../src/index';

            const map = new MapEngine(document.getElementById('map'), {
                minZoom: 2,
                maxZoom: 18,
                source: new UrlTileSource({
                    urlTemplate: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                }),
                controls: { position: 'topright' },
            });
            // Europe center in z0 pixel = world units
            map.setView({ x: 139, y: 87, zoom: 5 });

            const players = map.createLayer('players', { zIndex: 2 });
            const pois = map.createLayer('pois', { zIndex: 1 });

            const COLORS = ['#7fd1ff', '#ffd166', '#ef476f', '#06d6a0'];
            const movers = [];
            for (let i = 0; i < 400; i++) {
                const marker = players.addMarker({
                    x: 139 + (Math.random() - 0.5) * 50,
                    y: 87 + (Math.random() - 0.5) * 30,
                    color: COLORS[i % COLORS.length],
                    size: 12,
                    label: i % 40 === 0 ? 'Player ' + i : undefined,
                    data: { id: i },
                });
                if (i < 80) {
                    movers.push({
                        marker,
                        vx: (Math.random() - 0.5) * 0.1,
                        vy: (Math.random() - 0.5) * 0.1,
                    });
                }
            }
            // Web Mercator: lon/lat -> world units (z0 pixels of the 256x256 world)
            const project = (lon, lat) => {
                const x = ((lon + 180) / 360) * 256;
                const s = Math.sin((lat * Math.PI) / 180);
                const y = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256;
                return { x, y };
            };
            const CITIES = [
                ['London', -0.128, 51.507],
                ['Paris', 2.352, 48.857],
                ['Berlin', 13.405, 52.52],
                ['Madrid', -3.703, 40.417],
                ['Rome', 12.496, 41.902],
                ['Moscow', 37.617, 55.756],
                ['Cairo', 31.236, 30.044],
                ['Ankara', 32.859, 39.933],
            ];
            for (const [name, lon, lat] of CITIES) {
                const { x, y } = project(lon, lat);
                pois.addMarker({ x, y, color: '#06d6a0', size: 20, label: name });
            }

            setInterval(() => {
                for (const p of movers) {
                    p.marker.setPosition(p.marker.x + p.vx, p.marker.y + p.vy);
                }
            }, 100);

            let lastClick = 'click a marker…';
            map.on('marker:click', ({ marker }) => {
                lastClick =
                    'clicked: ' + (marker.label ?? 'player #' + marker.data.id) + ' @ ' + marker.x.toFixed(1) + ', ' + marker.y.toFixed(1);
            });

            const hud = document.getElementById('hud');
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cm-btn'; // same theme as the map controls
            btn.textContent = 'pois: on';
            btn.onclick = () => {
                if (pois.visible) pois.hide();
                else pois.show();
                btn.textContent = 'pois: ' + (pois.visible ? 'on' : 'off');
            };
            hud.after(btn);
            // pill, not square: a text label needs auto width
            btn.style.position = 'fixed';
            btn.style.top = '150px';
            btn.style.left = '12px';
            btn.style.width = 'auto';
            btn.style.padding = '0 14px';
            btn.style.font = '600 12px monospace';

            let frames = 0;
            let last = performance.now();
            const loop = (now) => {
                frames++;
                if (now - last >= 1000) {
                    const s = map.getView();
                    hud.textContent =
                        'fps: ' +
                        frames +
                        '\nzoom: ' +
                        s.zoom.toFixed(2) +
                        '\nmarkers: ' +
                        (players.count + pois.count) +
                        '\nlayers: players(z2) + pois(z1)' +
                        '\n' +
                        lastClick;
                    frames = 0;
                    last = now;
                }
                requestAnimationFrame(loop);
            };
            requestAnimationFrame(loop);
        </script>
    </body>
</html>
