<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CanvasMapper Example</title>
        <style>
            body {
                margin: 0;
                font-family: system-ui, sans-serif;
            }
            #map {
                width: 100vw;
                height: 100vh;
            }
            .hud {
                position: fixed;
                top: 12px;
                left: 12px;
                padding: 8px 12px;
                background: rgba(15, 20, 32, 0.8);
                color: #7fd1ff;
                border-radius: 8px;
                font: 12px/1.4 monospace;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <div class="hud" id="hud">drag to pan · wheel to zoom</div>
        <script type="module">
            import { MapEngine } from '../src/index';

            const map = new MapEngine(document.getElementById('map'), {
                minZoom: -2,
                maxZoom: 6,
            });

            map.setView({ x: 0, y: 0, zoom: 0 });

            map.on('viewchange', (state) => {
                document.getElementById('hud').textContent =
                    'x: ' + state.x.toFixed(0) + '  y: ' + state.y.toFixed(0) + '  zoom: ' + state.zoom.toFixed(2);
            });
        </script>
    </body>
</html>
